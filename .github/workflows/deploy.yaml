name: jd-screener-resume-picker-bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SHEET_ID: ${{ vars.SHEET_ID }}
  REGION: ${{ vars.REGION }}
  FUNCTION_NAME: jd-screener-resume-picker-bot
  MODEL_NAME: ${{ vars.MODEL_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Function App
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - uses: actions/checkout@v4

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - id: "deploy"
        uses: "google-github-actions/deploy-cloud-functions@v2"
        with:
          name: "jd-screener-bot-v1"
          description: "Gemini Resume Screener (Gen 1)"
          runtime: "python311"
          region: "${{ env.REGION }}"
          source_dir: "./src"
          entry_point: "handle_chat"
          memory_mb: "512Mi"
          min_instances: 1
          max_instances: 1
          env_vars: |-
            SHEET_ID=${{ vars.SHEET_ID }}
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            MODEL_NAME=${{ vars.MODEL_NAME }}
